<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenHorizon · Safety audio inspection</title>

<body><h1>Safety audio inspection</h1><p class="note">Runs the simulator’s TCAS, GPWS, and speech controller against repeatable test encounters.</p>
