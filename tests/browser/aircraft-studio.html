<!doctype html><html><head><meta charset="utf-8"><title>OpenHorizon · Aircraft inspection</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#b4bdc4;color:#17242e;font:13px system-ui}canvas{display:block}header{position:fixed;left:22px;top:20px;z-index:3}h1{font-size:19px;letter-spacing:-.04em;margin:0 0 4px}small{color:#425462}nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:max-content;max-width:94vw;padding:12px;background:#f4f6f7ee;border:1px solid #ffffff8a;border-radius:12px;box-shadow:0 6px 28px #18324720}button,select{font:inherit;color:#203644;background:#fff;border:1px solid #bdcbd4;padding:7px 10px;border-radius:5px;cursor:pointer}label{display:flex;gap:5px;align-items:center}output{position:fixed;right:22px;top:22px;font:11px ui-monospace;color:#314653}
input[type=range]{width:88px}#surface-state{position:fixed;right:22px;top:45px;max-width:45vw;max-height:30vh;overflow:auto;background:#f4f6f7dd;padding:10px;border-radius:8px;font:11px ui-monospace;white-space:pre-wrap}nav{width:1100px}
</style></head><body><header><h1>Aircraft inspection</h1><small>Actual flight models & lighting · drag to orbit · scroll to inspect</small></header><nav><select aria-label="Aircraft"><option value="172">Cessna 172S</option><option value="cub">Piper J-3 Cub</option><option value="737">Boeing 737-800</option><option value="a320">Airbus A320</option></select><button id="front">Front quarter</button><button id="rear">Rear quarter</button><button id="side">Side</button><button id="opposite">Opposite side</button><button id="detail">Close detail</button><button id="engine">Engine</button><select aria-label="Inspect surface"></select><button id="focus-surface">Focus surface</button><button id="underside-surface">Surface underside</button><label><input id="gear" type="checkbox" checked>Gear</label><label>Pitch (pull +)<input id="pitch" aria-label="Pitch" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Roll (right +)<input id="roll" aria-label="Roll" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Rudder (right +)<input id="yaw" aria-label="Rudder" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Pitch trim<input id="trim" aria-label="Pitch trim" type="range" min="-1" max="1" step="0.01" value="0"></label><label>Rudder trim<input id="rudderTrim" aria-label="Rudder trim" type="range" min="-0.3" max="0.3" step="0.01" value="0"></label><label>Flaps / slats<input id="flaps" aria-label="Flaps" type="range" min="0" max="1" step="0.01" value="0"></label><label>Spoilers / speedbrakes<input id="spoilers" aria-label="Spoilers" type="range" min="0" max="1" step="0.01" value="0"></label><button id="neutral-surfaces">Neutral surfaces</button><button id="full-surfaces">Full deployment</button><button id="positive-controls">Full pull / right</button><button id="negative-controls">Full push / left</button><label><input id="props" type="checkbox">Run engines</label><label><input id="sunset" type="checkbox">Low sun</label></nav><output id="stats"></output><pre id="surface-state" aria-label="Surface state" role="status"></pre><script type="module" src="./aircraft-studio.ts"></script></body></html>
